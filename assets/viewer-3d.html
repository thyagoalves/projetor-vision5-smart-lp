<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualização 3D - Projetor Vision 5 Smart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #F8F8F8;
            font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #F8F8F8;
            --poster-color: transparent;
            --progress-bar-color: transparent;
            --progress-bar-height: 0px;
            --progress-mask: transparent;
            cursor: grab;
        }

        model-viewer::part(default-progress-bar) {
            display: none !important;
        }

        model-viewer::part(default-progress-mask) {
            display: none !important;
        }

        model-viewer:active {
            cursor: grabbing;
        }

        /* Top Instruction Badge */
        .ui-overlay-top {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            width: calc(100% - 32px);
            max-width: 420px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .instruction-badge {
            background: #ffffff;
            border: 1px solid #E5E5EA;
            padding: 9px 22px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            color: #101010;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            box-shadow: none !important;
            animation: pulseHint 3s infinite ease-in-out;
        }

        @keyframes pulseHint {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Reset View Button */
        .control-btn {
            position: absolute;
            bottom: 22px;
            right: 22px;
            background: #ffffff;
            border: 1.5px solid #101010;
            color: #101010;
            padding: 9px 20px;
            border-radius: 50px;
            font-family: 'Urbanist', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 10;
            box-shadow: none !important;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .control-btn:hover {
            background: #101010;
            color: #ffffff;
        }

        .control-btn svg {
            transition: transform 0.4s ease;
        }

        .control-btn:hover svg {
            transform: rotate(-180deg);
        }

        /* Brand pill bottom-left */
        .brand-pill {
            position: absolute;
            bottom: 24px;
            left: 22px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #8E8E93;
            z-index: 10;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-pill::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #B5D921;
            display: inline-block;
        }

        /* Custom Loading Bar */
        .progress-bar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 20;
            transition: opacity 0.4s ease;
        }

        .progress-bar.hide {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3.5px solid rgba(16, 16, 16, 0.08);
            border-top-color: #101010;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .progress-text {
            font-size: 13px;
            font-weight: 600;
            color: #666666;
            letter-spacing: 0.3px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .ui-overlay-top {
                top: 14px;
                width: calc(100% - 24px);
            }
            .instruction-badge {
                font-size: 12px;
                padding: 7px 16px;
                gap: 7px;
            }
            .control-btn {
                bottom: 14px;
                right: 14px;
                padding: 7px 14px;
                font-size: 10px;
            }
            .brand-pill {
                bottom: 16px;
                left: 14px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="ui-overlay-top" id="instruction-overlay">
        <div class="instruction-badge">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                <path d="M2 12h20"></path>
            </svg>
            <span>Arraste para girar o Vision 5 Smart em 3D</span>
        </div>
    </div>

    <div class="brand-pill">3D Interativo</div>

    <button id="reset-btn" class="control-btn" aria-label="Redefinir Visão">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        <span>Redefinir Visão</span>
    </button>

    <div id="progress" class="progress-bar">
        <div class="spinner"></div>
        <div id="progress-text" class="progress-text">Carregando visualização 3D...</div>
    </div>

    <!-- Model Data (0.97 MB embutido, zero CORS, instantâneo) -->
    <script src="assets/model_data.js"></script>
    <script>
        if (!window.VISION5_MODEL_BASE64) {
            document.write('<script src="model_data.js"><\/script>');
        }
    </script>

    <model-viewer
        id="mv-projector"
        alt="Projetor Vision 5 Smart"
        auto-rotate
        auto-rotate-delay="1500"
        rotation-per-second="14deg"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="0.75"
        shadow-softness="0.85"
        exposure="1.05"
        environment-image="neutral"
        tone-mapping="aces"
        camera-orbit="142deg 75deg 3.6m"
        min-camera-orbit="auto 20deg 1.8m"
        max-camera-orbit="auto 95deg 6.0m"
        field-of-view="30deg">
        <div slot="progress-bar" style="display: none;"></div>
    </model-viewer>

    <script>
        const mv = document.getElementById('mv-projector');
        if (window.VISION5_MODEL_BASE64) {
            mv.src = "data:model/gltf-binary;base64," + window.VISION5_MODEL_BASE64;
        } else {
            mv.src = (window.location.pathname.indexOf('/assets/') !== -1 || window.location.pathname.indexOf('\\assets\\') !== -1)
                ? "Vision5EditedV3.glb"
                : "assets/Vision5EditedV3.glb";
        }
        const progressBar = document.getElementById('progress');
        const progressText = document.getElementById('progress-text');
        const resetBtn = document.getElementById('reset-btn');
        const instructionOverlay = document.getElementById('instruction-overlay');

        // Progress listener
        mv.addEventListener('progress', (e) => {
            const percent = Math.round(e.detail.totalProgress * 100);
            if (progressText) {
                progressText.textContent = 'Carregando visualização 3D (' + percent + '%)...';
            }
        });

        // Hide loader when loaded and tune metal materials
        mv.addEventListener('load', () => {
            if (progressBar) {
                progressBar.classList.add('hide');
            }

            // Calibração: carcaça frontal levemente mais clara que o restante do corpo
            if (mv.model && mv.model.materials) {
                for (const mat of mv.model.materials) {
                    if (mat.name === 'Material.003') {
                        // Carcaça frontal: grafite/titânio levemente mais claro
                        mat.pbrMetallicRoughness.setBaseColorFactor([0.095, 0.100, 0.112, 1.0]);
                        mat.pbrMetallicRoughness.setMetallicFactor(0.65);
                        mat.pbrMetallicRoughness.setRoughnessFactor(0.33);
                    } else if (mat.name === 'Metallic Grey Car Paint') {
                        // Restante do corpo: titânio escuro profundo
                        mat.pbrMetallicRoughness.setBaseColorFactor([0.055, 0.058, 0.065, 1.0]);
                        mat.pbrMetallicRoughness.setMetallicFactor(0.70);
                        mat.pbrMetallicRoughness.setRoughnessFactor(0.35);
                    } else if (mat.name === 'Mat_Base_Inferior') {
                        mat.pbrMetallicRoughness.setBaseColorFactor([0.045, 0.048, 0.055, 1.0]);
                        mat.pbrMetallicRoughness.setMetallicFactor(0.55);
                        mat.pbrMetallicRoughness.setRoughnessFactor(0.40);
                    } else if (mat.name === 'Mat_Tampa_Superior') {
                        mat.pbrMetallicRoughness.setBaseColorFactor([0.038, 0.040, 0.045, 1.0]);
                        mat.pbrMetallicRoughness.setRoughnessFactor(0.36);
                        mat.pbrMetallicRoughness.setMetallicFactor(0.12);
                    } else if (mat.name === 'Mat_Lente_Aro') {
                        mat.pbrMetallicRoughness.setBaseColorFactor([0.22, 0.23, 0.25, 1.0]);
                        mat.pbrMetallicRoughness.setMetallicFactor(0.85);
                        mat.pbrMetallicRoughness.setRoughnessFactor(0.22);
                    }
                }
            }
        });

        // Reset button listener
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                mv.cameraOrbit = '142deg 75deg 3.6m';
                mv.fieldOfView = '30deg';
                mv.jumpCameraToGoal();
            });
        }

        // Hide instruction on user interaction
        mv.addEventListener('camera-change', (e) => {
            if (e.detail.source === 'user-interaction' && instructionOverlay) {
                instructionOverlay.style.opacity = '0';
                instructionOverlay.style.transform = 'translateX(-50%) translateY(-10px)';
            }
        });

        setTimeout(() => {
            if (instructionOverlay) {
                instructionOverlay.style.opacity = '0';
                instructionOverlay.style.transform = 'translateX(-50%) translateY(-10px)';
            }
        }, 6000);
    </script>
</body>
</html>
